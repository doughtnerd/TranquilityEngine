[package]
name = "myco"
version = "0.1.0"
description = "Myco Engine desktop shell (Tauri) for games and the editor"
authors = ["Chris Carlson"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "myco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"
# Gamepads (ADR 0335, src/gamepad.rs): SDL3 built from source with cmake and linked statically,
# with only what gamepads need (no audio, video, rendering, camera, dialogs, tray or power). The
# unix-console build lets SDL build on Linux without X11/Wayland headers, since it opens no windows.
# Exported desktop games get the same lines (src/export/desktop.ts, GAMEPAD_DEPENDENCIES).
sdl3 = { version = "0.22.1", features = ["build-from-source-static", "hidapi"] }
sdl3-sys = { version = "0.7.3", default-features = false, features = ["no-sdl-audio", "no-sdl-video", "no-sdl-gpu", "no-sdl-render", "no-sdl-camera", "no-sdl-dialog", "no-sdl-tray", "no-sdl-power", "sdl-unix-console-build"] }
# The debug link's Tauri commands (ADR 0379, 0403), shared with the Studio's shell; they wrap
# native/ws-listener (tungstenite on std threads). The editor only; exported games connect, never listen.
myco-debug-link-tauri = { path = "../native/debug-link-tauri" }
