# Myco's built-in navigation (ADR 0065): Foxfire.Navigation ported to Rust, compiled to WebAssembly.
# Crates in dependency order: nav-math → nav-recast → nav-format → nav-bake → nav-query → nav-crowd → nav-wasm.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Zlib"
publish = false

[workspace.dependencies]
nav-math = { path = "crates/nav-math" }
nav-format = { path = "crates/nav-format" }
nav-recast = { path = "crates/nav-recast" }
nav-bake = { path = "crates/nav-bake" }
nav-query = { path = "crates/nav-query" }
nav-crowd = { path = "crates/nav-crowd" }
wasm-bindgen = "=0.2.130"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# nav-wasm only: the boundary parses JSON settings into its own DTOs.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
