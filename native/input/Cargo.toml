# Myco's gamepad identification and mapping (ADR 0335), compiled to WebAssembly for the web.
# Crates: input-map (std only: families, browser ids, the SDL controller database) → input-wasm.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Zlib"
publish = false

[workspace.dependencies]
input-map = { path = "crates/input-map" }
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
