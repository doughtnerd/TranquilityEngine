# The standalone tween module (ADR 0420): the `tween` wire family over `myco-tween`
# (native/common/tween) with a small curve store and a sequence player, for UI animation without
# the animation plugin. `npm run build:tween` (build.mjs) builds it into src/engine/tween/wasm/,
# which is committed, so the engine builds without Rust.
[package]
name = "myco-tween-wasm"
description = "Myco's standalone tween module (ADR 0420): the tween table, curve easings and sequences, without the animation core."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
myco-tween = { path = "../common/tween" }
# The sequence player's records (`timeline` family: SEQ_CREATE, SEQ_MEMBER, TIMELINE_CONTROL, _INFO,
# _BLOCK, _CHANGE) and the core's status codes: the animation core's boundary crate, of which the
# release build links only those records' codecs.
anim-wire = { path = "../anim/crates/anim-wire" }
# The pin native/anim uses (build.mjs checks wasm-bindgen-cli against it).
wasm-bindgen = "=0.2.130"

# build.rs only: the embedded source hash (source_hash.rs), the animation core's pin.
[build-dependencies]
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
myco-wire = { path = "../common/wire" }
# tests/source_hash.rs includes source_hash.rs, as build.rs does.
sha2 = { version = "0.10", default-features = false }
# tests/parity.rs runs the animation core natively on the same records (never linked into the module).
anim-wasm = { path = "../anim/crates/anim-wasm" }

# native/anim's release profile, so the shared crate is optimised as it is in the animation core.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"

[workspace]
