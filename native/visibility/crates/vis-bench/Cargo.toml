[package]
name = "vis-bench"
description = "Myco occlusion core (ADR 0460): a city and a forest workload, Criterion benches and a smoke timer over the core. Never linked into a module."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vis-raster.workspace = true
vis-trim.workspace = true

[dev-dependencies]
# `cargo_bench_support` only: no plots, no rayon (the workspace pins default-features = false).
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "occlusion"
harness = false

[[example]]
name = "smoke"
