[package]
name = "audio-dsp"
description = "DSP kernels for Myco's audio core (ADR 0157): resampler, ramps, pan, filters, compressor, convolver, HRTF."
version.workspace = true
edition.workspace = true
# Ported Chromium files keep their BSD-3-Clause notice (api-and-models §5, task A0.10).
license = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
publish.workspace = true

[dependencies]
microfft.workspace = true
libm.workspace = true

[dev-dependencies]
# MIT. Dev-only: the loudness cross-check (Ld6, ADR 0171's test plan); never a normal dependency.
ebur128 = "=0.1.11"
