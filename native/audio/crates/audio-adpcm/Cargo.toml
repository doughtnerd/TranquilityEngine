[package]
name = "audio-adpcm"
description = "Myco's IMA ADPCM block reader (ADR 0351 §3 as 0359 §5 settles it): the block layout, its tables and the branchless decode step, shared by the audio core (clip format 6, decoded per voice each quantum) and the decoder worker (pack entries)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
# The layout's other writer: the tests decode the encoder's own blocks with this reader and check the tables agree
# (the encoder keeps its copy of them, so its wasm and its source hash don't move; see src/lib.rs).
myco_audio_encode = { package = "audio-encode", path = "../audio-encode" }
