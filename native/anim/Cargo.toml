# Myco's animation core (ADR 0370): Rust compiled to WebAssembly with simd128, one module instance per
# page. Built by `npm run build:anim` (native/anim/build.mjs) into src/plugins/animation/runtime/wasm/,
# which is committed, so the engine builds without Rust.
#
# Crates (ADR 0370, in dependency order; each crate's Cargo.toml declares its edges):
#   anim-wire (boundary records, TS generator; the record mechanism is native/common/wire, `myco-wire`, and the
#   `tween` family native/common/tween's, both re-exported, ADR 0420) . anim-math (SoA maths on glam + simd128)
#   anim-format (binary layouts) -> anim-offline (f64 reference) -> anim-compress, anim-sample
#   anim-pose -> anim-rig, anim-retarget, anim-match, anim-physics -> anim-graph -> anim-wasm (boundary)
#   anim-plugin-sdk (third-party node ABI), anim-meter (fuel pass), anim-bench (criterion benches).
# Shared crates outside the workspace (path dependencies, ADR 0370 and 0420): native/common/curve (`myco-curve`, with
# its `alloc` key parser) under anim-sample; native/common/wire (`myco-wire`) under anim-wire; native/common/tween
# (`myco-tween`: the tween table, easings and sequence programs) under anim-wire and anim-wasm, also linked by the
# standalone tween module (native/tween). The source hash covers native/common/.
#
# Coordinator-owned (docs/design/animation/ground-rules.md): tasks edit only their crate's own Cargo.toml.
[workspace]
resolver = "2"
# examples/plugin-sample (T45): a third-party node module built with anim-plugin-sdk.
members = ["crates/*", "examples/plugin-sample"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anim-wire = { path = "crates/anim-wire" }
anim-wasm = { path = "crates/anim-wasm" }
anim-math = { path = "crates/anim-math" }
anim-format = { path = "crates/anim-format" }
anim-compress = { path = "crates/anim-compress" }
anim-sample = { path = "crates/anim-sample" }
anim-pose = { path = "crates/anim-pose" }
anim-graph = { path = "crates/anim-graph" }
anim-rig = { path = "crates/anim-rig" }
anim-retarget = { path = "crates/anim-retarget" }
anim-match = { path = "crates/anim-match" }
anim-physics = { path = "crates/anim-physics" }
anim-offline = { path = "crates/anim-offline" }
anim-plugin-sdk = { path = "crates/anim-plugin-sdk" }
anim-meter = { path = "crates/anim-meter" }
# Maths. No `fast-math` (ADR 0370's deterministic rules); simd128 comes from the target feature.
glam = { version = "0.34", default-features = false, features = ["std"] }
# The boundary's glue for setup calls; build.mjs checks wasm-bindgen-cli against this pin.
wasm-bindgen = "=0.2.130"
# anim-wasm's build script only: the embedded source hash.
sha2 = { version = "0.10", default-features = false }
# anim-bench only (T82r adds it to that crate; unused until then, so it isn't resolved or built).
criterion = { version = "0.8", default-features = false }
# anim-meter (T45): the fuel pass parses, validates and re-encodes third-party node modules. no_std
# with alloc, so the pass also compiles to wasm for the editor's loader (Phase B). Bytecode Alliance,
# Apache-2.0 WITH LLVM-exception. `simd` parses simd128 (allowed); `validate` + `features` check the
# allowed proposal set.
wasmparser = { version = "0.263", default-features = false, features = ["validate", "features", "simd"] }
wasm-encoder = { version = "0.263", default-features = false, features = ["wasmparser"] }
# Tests only (T45): text-format fixtures and a pure-Rust interpreter that runs plugin modules natively.
wat = { version = "1.263", default-features = false }
wasmi = { version = "2.0", default-features = false, features = ["std", "validate", "simd"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
