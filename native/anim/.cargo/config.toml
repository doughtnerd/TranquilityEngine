# ADR 0370: the wasm build always has simd128 (no scalar fallback), so a plain `cargo build --target
# wasm32-unknown-unknown` here gives the same module as build.mjs. Native builds are untouched.
# Hashed into the source hash (anim-wasm/source_hash.rs), because it changes the binary.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
