[package]
name = "anim-bench"
description = "Myco animation core (ADR 0340): criterion benchmarks for the core's budgets (tripwires)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The scenarios (src/) drive the native core through the same calls the wasm boundary exports
# (`anim_wasm::init::Core`), with the test suites' synthetic generators. Never linked into the module.
[dependencies]
anim-wire.workspace = true
anim-math.workspace = true
anim-format.workspace = true
anim-compress.workspace = true
anim-sample.workspace = true
anim-pose.workspace = true
anim-graph.workspace = true
anim-rig.workspace = true
anim-retarget.workspace = true
anim-match.workspace = true
anim-physics.workspace = true
anim-offline.workspace = true
# Not a workspace dependency (nothing else depends on the boundary crate).
anim-wasm = { path = "../anim-wasm" }

[dev-dependencies]
# `cargo_bench_support` only: no plots, no rayon (the workspace pins default-features = false).
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "budgets"
harness = false

[[bench]]
name = "parts"
harness = false
