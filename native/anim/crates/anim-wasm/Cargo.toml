[package]
name = "anim-wasm"
description = "Myco animation core (ADR 0370): the WebAssembly boundary (init, assets, instances, evaluate, outputs) through wasm-bindgen."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anim-wire.workspace = true
# ADR 0420 spike: the tween table, sequence programs and easings (native/common/tween).
myco-tween = { path = "../../../common/tween" }
anim-math.workspace = true
anim-format.workspace = true
anim-sample.workspace = true
anim-pose.workspace = true
anim-graph.workspace = true
anim-rig.workspace = true
anim-retarget.workspace = true
anim-match.workspace = true
anim-physics.workspace = true
anim-plugin-sdk.workspace = true
wasm-bindgen.workspace = true
# The `editor` feature's compressed retarget bake only (T41); never in the runtime module.
anim-compress = { workspace = true, optional = true }

[features]
# Editor-worker builds (Phase B): `retarget_bake_compressed`. build.mjs builds without it.
editor = ["dep:anim-compress", "anim-retarget/compress"]

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
# tests/source_hash.rs includes source_hash.rs, as build.rs does.
sha2.workspace = true
# Tests build skeletons and clips with anim-format's writers and anim-compress, and compare the
# core with the f64 reference (anim-offline). Never linked into the module.
anim-compress.workspace = true
anim-offline.workspace = true
# T45: tests/plugin_fixtures.rs meters the sample node module for the Node test's fixture.
anim-meter.workspace = true
