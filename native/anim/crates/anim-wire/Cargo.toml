[package]
name = "anim-wire"
description = "Myco animation core (ADR 0370): the boundary's record layouts, defined once, with the TypeScript constants generated from them."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gen_wire"
path = "src/bin/gen_wire.rs"

# ADR 0420 spike: the record mechanism (myco-wire) and the tween family (myco-tween) moved to shared
# crates, re-exported here. The generator still writes its own JSON and TypeScript.
[dependencies]
myco-wire = { path = "../../../common/wire" }
myco-tween = { path = "../../../common/tween" }
