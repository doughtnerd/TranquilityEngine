# Occlusion-raster spike: a CPU software occlusion buffer in Rust (scalar reference + simd128/SSE path), built native
# and to WebAssembly (simd128). Its own workspace; nothing outside spikes/occlusion-raster/ depends on it.
[workspace]
resolver = "2"
members = ["crates/occ", "crates/occ-wasm", "crates/occ-bench"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

# Same release profile as native/anim: LTO, one codegen unit, abort on panic; rustc has no fast-math.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
