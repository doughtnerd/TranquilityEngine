# Occlusion-safety spike: ADR 0460 §3 safety gate. Own workspace; depends on the occlusion-raster spike's `occ` crate by path
# (read-only use: its rasteriser, depth buffer, camera and occludee test).
[workspace]
resolver = "2"
members = ["crates/safety"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
