[package]
name = "loudspike-size"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
own = []
ebur = ["loudspike/ebur"]

[dependencies]
loudspike = { path = "..", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
