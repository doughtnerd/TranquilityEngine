[package]
name = "symphonia-clip-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

# The same symphonia and features as native/audio/crates/audio-decode (M1b).
[dependencies]
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis"] }
